version: '3.8'

# Development stack only. Production should use the backend container behind a managed
# reverse proxy and deploy the frontend as static Vite output (for example on Vercel).
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/ai_product_intelligence.db}
      DEBUG: ${DEBUG:-true}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_DEV_BACKEND_URL: http://backend:8000
      VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-120000}
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
